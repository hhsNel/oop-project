name: Checklist Enforcement

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Check for unchecked boxes
        run: |
          PR_BODY=$(jq -r .pull_request.body "$GITHUB_EVENT_PATH")
          if echo "$PR_BODY" | grep -E -q '(-|\*) \[ \]'; then
            echo "unchecked boxes, exiting"
            exit 1
          else
            echo "no unchecked boxes"
          fi

